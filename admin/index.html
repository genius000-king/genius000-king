<!doctype html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#1A1B1F">
  <meta name="color-scheme" content="dark light">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>لوحة التحكم — aboal3z.dzn</title>

  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/img/logo.png">
  <link rel="preload" href="assets/fonts/cairo-arabic.woff2" as="font" type="font/woff2" crossorigin>

  <!-- ملفّ أنماط واحد بدل اثني عشر مرتبطة بـ @import متسلسلة -->
  <link rel="stylesheet" href="css/app.css">

  <script src="config.local.js" onerror="void 0"></script>
  <script>
    /* الوضع الفاتح/الداكن يُقرأ قبل أول رسمة — بلا هذا تومض اللوحة
       داكنة ثم تقفز فاتحة عند من اختار الفاتح. */
    (function () {
      try {
        var m = localStorage.getItem('aboal3z:admin-theme');
        if (m) document.documentElement.dataset.theme = m;
      } catch (e) { /* وضع خاص */ }
      var u = (window.APP_CONFIG || {}).SUPABASE_URL;
      if (!u) return;
      ['preconnect', 'dns-prefetch'].forEach(function (rel) {
        var l = document.createElement('link');
        l.rel = rel; l.href = u; l.crossOrigin = 'anonymous';
        document.head.appendChild(l);
      });
    })();
  </script>

  <link rel="modulepreload" href="js/main.js">
  <link rel="modulepreload" href="js/core/dom.js">
  <link rel="modulepreload" href="js/core/api.js">
  <link rel="modulepreload" href="js/core/store.js">
  <link rel="modulepreload" href="js/core/auth.js">
  <link rel="modulepreload" href="js/core/router.js">
  <link rel="modulepreload" href="js/ui/icon.js">
  <link rel="modulepreload" href="js/views/auth.js">
  <link rel="modulepreload" href="js/shell/sidebar.js">
  <link rel="modulepreload" href="js/shell/topbar.js">
</head>
<body>
  <!-- شاشة الدخول -->
  <div id="auth"></div>

  <!-- الهيكل -->
  <div id="app" hidden>
    <aside id="sidebar" aria-label="التنقّل"></aside>
    <header id="topbar"></header>
    <main id="main" tabindex="-1"></main>
    <nav id="tabbar" aria-label="التنقّل السريع"></nav>
  </div>

  <div id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
