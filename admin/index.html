<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#050A14">
  <title>لوحة التحكم — aboal3z.dzn</title>

  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preload" href="assets/fonts/ibmplex-0.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/main.css">
</head>
<body class="leader">
  <!-- شاشة الدخول — تُبنى من js/panels/auth-screen.js -->
  <div id="auth"></div>

  <!-- الهيكل: شريط أدوات رفيع + معاينة حيّة لموقع العملاء تحته -->
  <div id="shell" hidden>
    <header id="toolbar"></header>

    <div id="stage">
      <div id="preview">
        <canvas id="stars" data-fx="starfield" aria-hidden="true"></canvas>
        <header id="nav"></header>
        <main id="page">
          <section id="hero"         class="section" data-section="hero"></section>
          <section id="about"        class="section" data-section="about"></section>
          <section id="works"        class="section" data-section="works"></section>
          <section id="packages"     class="section" data-section="packages"></section>
          <section id="services"     class="section" data-section="services"></section>
          <section id="process"      class="section" data-section="process"></section>
          <section id="testimonials" class="section" data-section="testimonials"></section>
          <section id="payments"     class="section" data-section="payments"></section>
          <section id="order"        class="section" data-section="order"></section>
        </main>
        <footer id="footer" data-section="footer"></footer>
      </div>
    </div>
  </div>

  <div id="panelRoot"></div>
  <div id="lightbox"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <div id="modalRoot"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
