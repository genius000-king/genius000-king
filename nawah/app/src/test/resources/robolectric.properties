# Pinned below compileSdk on purpose.
#
# The app compiles against SDK 37, but Robolectric 4.17 has no runtime for it:
# setting up the application state reaches for ApplicationSharedMemory, which
# only exists in Android 16, and fails with "Failed to interact with raw
# FileDescriptor internals" — a message about neither Robolectric nor the SDK.
#
# 34 is the newest level this Robolectric ships a full runtime for. Nothing
# under test here is version-specific: these are JSON parsing and
# SharedPreferences, which have behaved identically since API 1.
sdk=34
