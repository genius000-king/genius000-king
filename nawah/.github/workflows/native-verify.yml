name: native-verify

on:
  push:
    paths:
      - "app/src/main/jniLibs/**"
      - "tools/native/**"
  pull_request:
    paths:
      - "app/src/main/jniLibs/**"
      - "tools/native/**"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y patchelf
      # Fails on a drifted hash or an unresolved DT_NEEDED -- the two ways a
      # bad native binary reaches a device as "proot: not found".
      - run: python3 tools/native/verify.py
