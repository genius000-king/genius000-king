<title>Character and Cloud Recreation</title>
<style>
  :root {
    --page: #e9e9e6;
    --gutter: 16px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --page: #1d1d1c; }
  }
  :root[data-theme="dark"] { --page: #1d1d1c; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--page);
    min-height: 100vh;
    box-sizing: border-box;
    padding: var(--gutter);
  }
  .grid {
    display: grid;
    gap: var(--gutter);
    grid-template-columns: repeat(auto-fit, minmax(min(100%, 360px), 1fr));
    align-items: start;
    max-width: 1400px;
    margin: 0 auto;
  }
  figure { margin: 0; overflow: hidden; }
  .phone {
    aspect-ratio: 1035 / 1380;
    border-radius: 36px;
    background: #e4e7e2;
  }
  .front {
    aspect-ratio: 762 / 978;
    border-radius: 36px;
    background: #2f302c;
    padding: 0 26px;
    box-sizing: border-box;
  }
  .front > svg {
    border-radius: 34px;
  }
  .cloud {
    grid-column: 1 / -1;
    aspect-ratio: 757 / 557;
    border-radius: 14px;
    background: #3d3d3d;
  }
  svg, canvas {
    display: block;
    width: 100%;
    height: 100%;
  }
</style>

  <!-- Reference 3: Blender-style volumetric cloud -->

    <canvas id="cloud" width="1514" height="1114" aria-hidden="true"></canvas>

<script>
(function () {
  var W = 757, H = 557, DPR = 2;
  var canvas = document.getElementById('cloud');
  canvas.width = W * DPR;
  canvas.height = H * DPR;
  var g = canvas.getContext('2d');
  g.scale(DPR, DPR);

  // Seeded RNG so the cloud is identical on every load
  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  var rnd = mulberry32(7);
  var clamp = function (v, a, b) { return Math.min(b, Math.max(a, v)); };

  // Viewport background: radial gradient, Blender-like dark grey
  var bg = g.createRadialGradient(380, 240, 40, 380, 260, 620);
  bg.addColorStop(0, '#474747');
  bg.addColorStop(1, '#2c2c2c');
  g.fillStyle = bg;
  g.fillRect(0, 0, W, H);

  // Floor grid in perspective
  var vp = { x: 390, y: 300 };
  g.lineWidth = 1;
  g.strokeStyle = 'rgba(255,255,255,0.09)';
  for (var gx = -900; gx <= 1700; gx += 110) {
    g.beginPath();
    g.moveTo(vp.x, vp.y);
    g.lineTo(gx, H + 20);
    g.stroke();
  }
  for (var k = 1; k <= 9; k++) {
    var gy = vp.y + Math.pow(k / 9, 1.9) * (H - vp.y + 40);
    g.beginPath();
    g.moveTo(0, gy);
    g.lineTo(W, gy);
    g.stroke();
  }

  // Axis lines: red X and green Y
  g.lineWidth = 2.2;
  g.strokeStyle = 'rgba(200,55,58,0.9)';
  g.beginPath(); g.moveTo(0, 398); g.lineTo(540, H); g.stroke();
  g.strokeStyle = 'rgba(95,174,60,0.9)';
  g.beginPath(); g.moveTo(215, H); g.lineTo(W, 396); g.stroke();

  // Cloud: puffs distributed over the silhouette
  var ellipses = [
    { x: 250, y: 275, rx: 150, ry: 105 },
    { x: 430, y: 190, rx: 150, ry: 115 },
    { x: 560, y: 262, rx: 130, ry: 105 },
    { x: 380, y: 335, rx: 220, ry: 85 },
    { x: 330, y: 125, rx: 90, ry: 65 }
  ];
  var puffs = [];
  for (var i = 0; i < 420; i++) {
    var e = ellipses[Math.floor(rnd() * ellipses.length)];
    var ang = rnd() * Math.PI * 2;
    var rr = Math.sqrt(rnd());
    var x = e.x + Math.cos(ang) * e.rx * rr;
    var y = e.y + Math.sin(ang) * e.ry * rr;
    var r = 18 + rnd() * 46 * (1 - rr * 0.4);
    puffs.push({ x: x, y: y, r: r });
  }
  puffs.sort(function (a, b) { return a.y - b.y; });

  function puffColor(p) {
    // Bottom and left pick up blue; top and right stay white
    var t = Math.pow(clamp((p.y - 250) / 170, 0, 1), 1.1);
    var l = clamp((320 - p.x) / 170, 0, 1) * clamp((p.y - 230) / 130, 0, 1) * 0.6;
    var mix = clamp(t + l, 0, 1);
    var white = [244, 246, 250];
    var blue = [96, 130, 210];
    var deep = [40, 70, 165];
    var c = [0, 0, 0];
    for (var j = 0; j < 3; j++) {
      var b = mix < 0.8 ? blue[j] : blue[j] + (deep[j] - blue[j]) * (mix - 0.8) / 0.2;
      c[j] = Math.round(white[j] + (b - white[j]) * mix);
    }
    return c;
  }

  puffs.forEach(function (p) {
    var c = puffColor(p);
    var str = 'rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')';
    var grd = g.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r);
    grd.addColorStop(0, 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',1)');
    grd.addColorStop(0.85, 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',0.9)');
    grd.addColorStop(1, 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',0)');
    g.fillStyle = grd;
    g.beginPath();
    g.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    g.fill();
  });

  // Bright highlights on the upper right of the cloud
  for (var h = 0; h < 90; h++) {
    var hx = 300 + rnd() * 330, hy = 120 + rnd() * 170;
    if (hy > 280) continue;
    var hr = 12 + rnd() * 30;
    var hg = g.createRadialGradient(hx, hy, 0, hx, hy, hr);
    hg.addColorStop(0, 'rgba(255,255,255,0.7)');
    hg.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = hg;
    g.beginPath();
    g.arc(hx, hy, hr, 0, Math.PI * 2);
    g.fill();
  }

  // Blender navigation gizmo fragment, top right
  g.lineCap = 'round';
  g.strokeStyle = '#f0821e';
  g.lineWidth = 12;
  g.beginPath(); g.moveTo(757, 36); g.lineTo(728, 58); g.lineTo(706, 92); g.stroke();
})();
</script>
