// ---------- Renderer / scene / camera ----------
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setClearColor(0x000000, 0);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(22, window.innerWidth / window.innerHeight, 0.1, 100);
const FOCUS = new THREE.Vector3(0, 1.52, 0);
camera.position.set(0, 1.52, 9.7);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.copy(FOCUS);
controls.enableDamping = true;

controls.enablePan = false;
controls.minDistance = 4;

controls.maxPolarAngle = Math.PI * 0.55;

controls.update();

// ---------- Lights ----------
scene.add(new THREE.HemisphereLight(0xffffff, 0x9a9c98, 1.35));
const key = new THREE.DirectionalLight(0xffffff, 2.0);
key.position.set(-2.5, 4.5, 5);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -2.5;
key.shadow.camera.right = 2.5;

key.shadow.camera.near = 1;
key.shadow.camera.far = 20;

const fill = new THREE.DirectionalLight(0xffffff, 0.45);
fill.position.set(3, 2, 4);
scene.add(fill);

// ---------- Surroundings: backdrop card, its marks, and the floor shadow ----------
function canvasTexture(draw, w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

function roundedRectShape(x0, y0, x1, y1, r) {
  const s = new THREE.Shape();
  s.moveTo(x0 + r, y0);
  s.lineTo(x1 - r, y0);
  s.quadraticCurveTo(x1, y0, x1, y0 + r);
  s.lineTo(x1, y1 - r);
  s.quadraticCurveTo(x1, y1, x1 - r, y1);
  s.lineTo(x0 + r, y1);
  s.quadraticCurveTo(x0, y1, x0, y1 - r);
  s.lineTo(x0, y0 + r);
  s.quadraticCurveTo(x0, y0, x0 + r, y0);
  return s;
}

const card = D.card;
const cardTex = canvasTexture((g, w, h) => {
  const gr = g.createLinearGradient(0, 0, 0, h);
  gr.addColorStop(0, '#efe6e3');
  gr.addColorStop(1, '#e2dbee');
  g.fillStyle = gr;
  g.fillRect(0, 0, w, h);
}, 8, 64);
const cardGeo = new THREE.ShapeGeometry(roundedRectShape(card.x0, card.y0, card.x1, card.y1, card.r), 24);
const cardMesh = new THREE.Mesh(cardGeo, new THREE.MeshBasicMaterial({ map: cardTex, toneMapped: false }));
cardMesh.position.z = -0.6;
cardMesh.receiveShadow = false;
scene.add(cardMesh);

const bar = D.cardMarks.bar;
const barMesh = new THREE.Mesh(
  new THREE.PlaneGeometry(bar[2] - bar[0], bar[3] - bar[1]),
  new THREE.MeshBasicMaterial({ color: 0xefd98a, toneMapped: false })
);
barMesh.position.set((bar[0] + bar[2]) / 2, (bar[1] + bar[3]) / 2, -0.59);
scene.add(barMesh);

const shadowTex = canvasTexture((g, w, h) => {
  const gr = g.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2);
  gr.addColorStop(0, 'rgba(70,74,96,0.42)');
  gr.addColorStop(1, 'rgba(70,74,96,0)');
  g.fillStyle = gr;
  g.fillRect(0, 0, w, h);
}, 256, 256);
const contact = new THREE.Mesh(
  new THREE.PlaneGeometry(1.2, 0.36),
  new THREE.MeshBasicMaterial({ map: shadowTex, transparent: true, depthWrite: false })
);
contact.rotation.x = -Math.PI / 2;
contact.position.set(-0.46, 0.003, 0.02);
scene.add(contact);

const ground = new THREE.Mesh(new THREE.PlaneGeometry(20, 20), new THREE.ShadowMaterial({ opacity: 0.18 }));
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// ---------- Geometry builders ----------
const hex = (h) => new THREE.Color(h);

// Loft: a stack of elliptical rings, one per measured row (y ascending)
function loft(rows, color, opts = {}) {
  const R = rows.filter(r => r.rx > 0.004 && r.rz > 0.004).sort((a, b) => a.y - b.y);
  if (R.length < 2) return null;
  const seg = opts.seg || 36;
  const n = R.length;
  const pos = [], col = [], idx = [];
  const c = new THREE.Color();
  for (let i = 0; i < n; i++) {
    const q = R[i];
    for (let s = 0; s < seg; s++) {
      const t = (s / seg) * Math.PI * 2;
      const x = q.cx + Math.cos(t) * q.rx;
      const z = (q.cz || 0) + Math.sin(t) * q.rz;
      pos.push(x, q.y, z);
      if (opts.colorAt) c.copy(opts.colorAt(x, q.y, z)); else c.copy(color);
      col.push(c.r, c.g, c.b);
    }
  }
  const bIdx = n * seg, tIdx = n * seg + 1;
  pos.push(R[0].cx, R[0].y, R[0].cz || 0, R[n - 1].cx, R[n - 1].y, R[n - 1].cz || 0);
  const cb = opts.colorAt ? opts.colorAt(R[0].cx, R[0].y, 0) : color;
  const ct = opts.colorAt ? opts.colorAt(R[n - 1].cx, R[n - 1].y, 0) : color;
  col.push(cb.r, cb.g, cb.b, ct.r, ct.g, ct.b);
  for (let i = 0; i < n - 1; i++) {
    for (let s = 0; s < seg; s++) {
      const a = i * seg + s, b = i * seg + ((s + 1) % seg);
      const cc = (i + 1) * seg + s, d = (i + 1) * seg + ((s + 1) % seg);
      idx.push(a, cc, b, b, cc, d);
    }
  }
  for (let s = 0; s < seg; s++) {
    idx.push(bIdx, s, (s + 1) % seg);
    idx.push(tIdx, (n - 1) * seg + ((s + 1) % seg), (n - 1) * seg + s);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}

const vmat = (extra = {}) => new THREE.MeshStandardMaterial({
  vertexColors: true, roughness: 0.8, metalness: 0, side: THREE.DoubleSide, ...extra
});
const cmat = (color, extra = {}) => new THREE.MeshStandardMaterial({
  color: hex(color), roughness: 0.8, metalness: 0, side: THREE.DoubleSide, ...extra
});
function addMesh(parent, geo, material) {
  if (!geo) return null;
  const m = new THREE.Mesh(geo, material);
  m.castShadow = true;
  m.receiveShadow = true;
  parent.add(m);
  return m;
}

// ---------- Character ----------
const hero = new THREE.Group();
scene.add(hero);
const K = D.colors;

// Cap: blue dome from the measured silhouette rows
addMesh(hero, loft(D.cap, hex(K.cap)), vmat());

// Brim: flat disc of the measured front-view brim, pointing to the viewer's left
{
  const brim = new THREE.Shape();
  brim.moveTo(-0.10, 2.70);
  brim.lineTo(-0.36, 2.64);
  brim.lineTo(-0.40, 2.58);
  brim.lineTo(-0.20, 2.56);
  brim.lineTo(-0.08, 2.62);
  brim.closePath();
  const g = new THREE.ExtrudeGeometry(brim, { depth: 0.05, bevelEnabled: true, bevelSize: 0.015, bevelThickness: 0.015, bevelSegments: 2 });
  g.translate(0, 0, 0.22);
  addMesh(hero, g, cmat(K.cap));
}

// Head: skin with red hair on top and back, yellow tips on the right side
const hairRed = hex(K.hairRed);
const hairYellow = hex(K.hairYellow);
const faceCol = hex(K.face);
const headColor = (x, y, z) => {
  if (y > 2.62) return hairRed;                       // hair under the cap
  if (z < -0.02 && y > 2.30) return hairRed;          // back of the head
  if (x > 0.15 && y > 2.42 && y <= 2.62) return hairYellow; // yellow tips on the right
  if (x < -0.16 && y > 2.45) return hairRed;          // red fringe on the left
  return faceCol;
};
addMesh(hero, loft(D.head, null, { colorAt: headColor }), vmat());
// Eyes: two dark ovals on the front of the face, at the measured front-view positions
const eyeMat = cmat('#2b3a6b');
[-0.16, 0.015].forEach((ex) => {
  const eye = new THREE.Mesh(new THREE.SphereGeometry(0.028, 16, 12), eyeMat);
  eye.scale.set(1, 0.7, 0.4);
  eye.position.set(ex, 2.55, 0.27);
  hero.add(eye);
});

// Torso: cropped cream tee down to the waist
addMesh(hero, loft(D.torso, hex(K.tee)), vmat());
// Hips: pants
addMesh(hero, loft(D.hips, hex(K.pants)), vmat());

// Legs: near leg (viewer's left) and far leg
function leg(rows, base) {
  addMesh(hero, loft(rows, hex(base)), vmat());
}
leg(D.legL, K.pants);
leg(D.legR, K.pantsFar);

// Arms: skin, far arm a touch darker (as in the reference)
addMesh(hero, loft(D.armL, hex(K.armSkin)), vmat());
addMesh(hero, loft(D.armR, hex(K.armSkinFar)), vmat());

// Hands: yellow fist on the viewer's left, brown hand on the right
addMesh(hero, loft(D.handL, null, { colorAt: (x, y) => (y > 1.45 ? hex(K.handYellow) : hex(K.handBrown)) }), vmat());
addMesh(hero, loft(D.handR, hex(K.handBrown)), vmat());

// Shoes: extruded measured silhouettes, cream upper
function shoe(points, z, color) {
  const sh = new THREE.Shape();
  sh.moveTo(points[0][0], points[0][1]);
  for (let i = 1; i < points.length; i++) sh.lineTo(points[i][0], points[i][1]);
  sh.closePath();
  const g = new THREE.ExtrudeGeometry(sh, { depth: 0.42, bevelEnabled: true, bevelSize: 0.03, bevelThickness: 0.03, bevelSegments: 3, curveSegments: 4 });
  g.translate(0, 0, -0.21);
  g.computeBoundingBox();
  const minY = g.boundingBox.min.y;
  g.translate(0, -minY, 0);
  const mesh = addMesh(hero, g, cmat(color));
  mesh.position.z = z;
  return mesh;
}
shoe(D.shoeL, -0.12, K.shoe);
shoe(D.shoeR, 0.10, K.shoe);

// Bag: box at the measured position, brown
{
  const b = D.bag;
  const g = new THREE.BoxGeometry(b.x1 - b.x0, b.y1 - b.y0, 0.16);
  g.translate((b.x0 + b.x1) / 2, (b.y0 + b.y1) / 2, 0.22);
  addMesh(hero, g, cmat(K.bag));
}

// Strap from the right shoulder down to the bag, over the chest
{
  const pts = D.strap.map(([x, y]) => new THREE.Vector3(x, y, 0.27));
  const curve = new THREE.CatmullRomCurve3(pts);
  const tube = new THREE.Mesh(new THREE.TubeGeometry(curve, 40, 0.018, 8), cmat('#1f1f1f'));
  tube.castShadow = true;
  hero.add(tube);
}

// ---------- Loop / resize ----------
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
});
