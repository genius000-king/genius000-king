name: TV Control Hub

on:
  push:
    paths: ["tv-control-hub/**", ".github/workflows/tv-control-hub.yml"]
  pull_request:
    paths: ["tv-control-hub/**"]
  workflow_dispatch:

defaults:
  run:
    working-directory: tv-control-hub

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: android-actions/setup-android@v3
      - name: Android SDK 37
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0" > /dev/null
      - uses: gradle/actions/setup-gradle@v4
      - name: Setup script (syntax + behaviour against a fake adb)
        run: bash -n tools/tv-setup.sh && tools/test/tv-setup.test.sh
      - name: Unit, integration, end-to-end and screenshot tests
        run: ./gradlew test -Proborazzi.test.record=true --continue
      - name: Lint
        run: ./gradlew :app:lintDebug
      - name: APKs
        run: ./gradlew :app:assembleDebug :app:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: tv-control-hub/app/build/outputs/apk/**/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: tv-control-hub/**/build/outputs/roborazzi/*.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: tv-control-hub/**/build/reports/tests/
