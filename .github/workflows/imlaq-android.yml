name: Imlaq Android

# Builds the engine for arm64 and the APK on every push that touches the app, so a debug APK is
# always one tap away (Actions → run → Artifacts) without a computer.
on:
  push:
    paths:
      - "imlaq/**"
      - ".github/workflows/imlaq-android.yml"
  pull_request:
    paths:
      - "imlaq/**"
  workflow_dispatch:

concurrency:
  group: imlaq-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: imlaq
    env:
      NDK_VERSION: 29.0.14206865
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Install NDK, CMake platform and Ninja
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null
          sudo apt-get update -q && sudo apt-get install -y -q ninja-build
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Build native engines
        run: ./scripts/build-native.sh

      - name: Unit tests
        run: ./gradlew test

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: imlaq-debug-apk
          path: imlaq/app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: imlaq/app/build/screenshots/
          if-no-files-found: ignore

  # The Kotlin side against the REAL engine: a host build of bmoe-cli streaming a tiny MoE model.
  # Guards the session protocol whenever the BigMoeOnEdge submodule is bumped.
  engine-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: imlaq
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build bmoe-cli for the host
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ninja-build
          cmake -S third_party/bigmoeonedge -B build-native/host -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DBMOE_BUILD_TESTS=OFF -DLLAMA_CURL=OFF
          cmake --build build-native/host -j "$(nproc)" --target bmoe-cli

      - name: Make tiny MoE models
        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install -q numpy third_party/bigmoeonedge/third_party/llama.cpp/gguf-py
          mkdir -p /tmp/models/sharded
          /tmp/venv/bin/python third_party/bigmoeonedge/scripts/make-tiny-moe.py --arch qwen3moe --out /tmp/models/tiny-moe.gguf
          /tmp/venv/bin/python third_party/bigmoeonedge/scripts/make-tiny-moe.py --arch qwen3moe \
            --split-max-tensors 20 --out /tmp/models/sharded/tiny-moe.gguf

      - name: Integration tests
        env:
          IMLAQ_HOST_ENGINE: ${{ github.workspace }}/imlaq/build-native/host/cli/bmoe-cli
          IMLAQ_TINY_MOE: /tmp/models/tiny-moe.gguf
        run: ./gradlew :engine:host:testDebugUnitTest --tests '*IntegrationTest*'
