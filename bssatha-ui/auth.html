<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>تسجيل الدخول — بسّطها</title>
  <meta name="theme-color" content="#FBF5EC">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Marhey:wght@500;700&family=Readex+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/core.css">
  <script src="assets/js/lab.js"></script>
  <style>
    .auth { display: grid; grid-template-columns: 1fr 1fr; min-height: 100dvh; }
    .auth-form { display: grid; align-content: center; justify-items: center; padding: var(--s7) 16px; }
    .auth-box { width: min(100%, 400px); }
    .auth-box > .logo { margin-bottom: var(--s7); }
    .auth-box h1 { font-size: var(--fs-2xl); }
    .auth-box .lead { color: var(--ink-2); margin: 6px 0 var(--s6); }
    .oauth { display: grid; gap: 10px; }
    .oauth .btn { height: 50px; font-size: var(--fs-sm); }
    .or { display: flex; align-items: center; gap: 12px; margin: var(--s5) 0; color: var(--ink-3); font-size: var(--fs-xs); }
    .or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--line); }
    form { display: grid; gap: var(--s4); }
    .pw-toggle { position: absolute; inset-inline-end: 6px; top: 50%; translate: 0 -50%; }
    .row { display: flex; justify-content: space-between; align-items: center; font-size: var(--fs-sm); }
    .row a { color: var(--brand); font-weight: 600; }
    .switch-mode { margin-top: var(--s5); text-align: center; font-size: var(--fs-sm); color: var(--ink-2); }
    .switch-mode button { color: var(--brand); font-weight: 600; }
    .terms { font-size: var(--fs-xs); color: var(--ink-3); text-align: center; }
    .terms a { text-decoration: underline; }
    .err { color: var(--danger); font-size: var(--fs-xs); min-height: 1em; }
    .input.invalid { border-color: var(--danger); }
    .strength { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
    .strength span { height: 4px; border-radius: 4px; background: var(--line); transition: background var(--t-med); }

    .auth-art { position: relative; margin: 12px; border-radius: 32px; background: var(--ink); color: #fff; overflow: hidden; display: grid; align-content: center; justify-items: center; padding: var(--s7); text-align: center; }
    .auth-art .mascot-wrap { width: 230px; }
    .auth-art blockquote { margin: var(--s6) 0 0; font-family: var(--font-display); font-size: 1.6rem; line-height: 1.5; max-width: 18ch; }
    .auth-art cite { display: block; margin-top: var(--s4); font-style: normal; font-size: var(--fs-sm); color: rgba(255,255,255,.6); }
    .auth-art .floaty { position: absolute; padding: 10px 14px; border-radius: var(--r-md); background: rgba(255,255,255,.08); backdrop-filter: blur(6px); font-size: var(--fs-xs); display: flex; align-items: center; gap: 8px; }
    .auth-art .floaty .i { color: var(--sun); }
    .spin { width: 18px; height: 18px; border: 2.5px solid rgba(255,255,255,.4); border-top-color: #fff; border-radius: 50%; animation: sp .7s linear infinite; }
    @keyframes sp { to { transform: rotate(360deg); } }
    @media (max-width: 960px) {
      .auth { grid-template-columns: 1fr; }
      .auth-art { display: none; }
      .auth-box > .logo { margin-bottom: var(--s6); }
    }
  </style>
</head>
<body>
<main class="auth">
  <section class="auth-form">
    <div class="auth-box">
      <a href="index.html" data-logo></a>
      <h1 class="display" id="title">أهلاً من جديد 👋</h1>
      <p class="lead" id="lead">سجّل دخولك لتكمل عروضك.</p>

      <div class="oauth">
        <button class="btn btn-block" type="button" data-oauth="google">
          <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3 0 5.8 1.1 7.9 3l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3 0 5.8 1.1 7.9 3l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2c-2 1.5-4.5 2.4-7.2 2.4-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
          المتابعة بحساب Google
        </button>
        <button class="btn btn-dark btn-block" type="button" data-oauth="apple"><i data-i="apple"></i>المتابعة بحساب Apple</button>
      </div>

      <div class="or">أو بالبريد الإلكتروني</div>

      <form id="form" novalidate>
        <div class="field" id="nameField" hidden>
          <label class="label" for="name">الاسم</label>
          <input class="input" id="name" name="name" autocomplete="name" placeholder="مثال: عبدالله">
        </div>
        <div class="field">
          <label class="label" for="email">البريد الإلكتروني</label>
          <input class="input ltr" id="email" name="email" type="email" autocomplete="email" placeholder="name@example.com" style="text-align:right">
          <span class="err" id="emailErr"></span>
        </div>
        <div class="field">
          <div class="row"><label class="label" for="pw">كلمة المرور</label><a href="#" id="forgot">نسيتها؟</a></div>
          <div class="input-wrap">
            <input class="input" id="pw" name="password" type="password" autocomplete="current-password" placeholder="••••••••" style="padding-inline-start:14px;padding-inline-end:48px">
            <button type="button" class="btn btn-ghost btn-icon btn-sm pw-toggle" id="pwToggle" aria-label="إظهار كلمة المرور"><i data-i="eye"></i></button>
          </div>
          <div class="strength" id="strength" hidden aria-hidden="true"><span></span><span></span><span></span><span></span></div>
          <span class="err" id="pwErr"></span>
        </div>
        <button class="btn btn-primary btn-lg btn-block" id="submit" type="submit">تسجيل الدخول</button>
        <p class="terms" id="terms" hidden>بإنشاء الحساب، أنت توافق على <a href="#">الشروط</a> و<a href="#">سياسة الخصوصية</a>.</p>
      </form>

      <p class="switch-mode"><span id="switchTxt">ليس لديك حساب؟</span> <button type="button" id="switchBtn">أنشئ حساباً مجاناً</button></p>
    </div>
  </section>

  <aside class="auth-art" aria-hidden="true">
    <div class="floaty" data-lab="auth-badge1" style="top:12%;inset-inline-start:10%"><i data-i="gift"></i>50 كريدت مجاناً عند التسجيل</div>
    <div class="floaty" data-lab="auth-badge2" style="bottom:14%;inset-inline-end:10%"><i data-i="bolt"></i>عرض كامل في أقل من 10 دقائق</div>
    <div class="mascot-wrap" data-lab="auth-mascot"><div class="wiggle" data-mascot="flame"></div></div>
    <blockquote>«كل ما تحتاجه… فكرة.»</blockquote>
    <cite>والباقي علينا</cite>
  </aside>
</main>

<script src="assets/js/core.js"></script>
<script src="assets/js/api.js"></script>
<script>
(() => {
  const { $, toast, icon } = UI;
  const params = new URLSearchParams(location.search);
  let mode = params.get("mode") === "signup" ? "signup" : "login";

  function render() {
    const s = mode === "signup";
    $("#title").textContent = s ? "ابدأ رحلتك ✨" : "أهلاً من جديد 👋";
    $("#lead").textContent = s ? "حساب مجاني + 50 كريدت لعرضك الأول." : "سجّل دخولك لتكمل عروضك.";
    $("#nameField").hidden = !s;
    $("#strength").hidden = !s;
    $("#terms").hidden = !s;
    $("#forgot").hidden = s;
    $("#submit").textContent = s ? "إنشاء الحساب" : "تسجيل الدخول";
    $("#switchTxt").textContent = s ? "لديك حساب؟" : "ليس لديك حساب؟";
    $("#switchBtn").textContent = s ? "سجّل الدخول" : "أنشئ حساباً مجاناً";
    $("#pw").autocomplete = s ? "new-password" : "current-password";
    document.title = (s ? "إنشاء حساب" : "تسجيل الدخول") + " — بسّطها";
  }
  $("#switchBtn").addEventListener("click", () => { mode = mode === "signup" ? "login" : "signup"; render(); });
  render();

  $("#pwToggle").addEventListener("click", (e) => {
    const pw = $("#pw"), show = pw.type === "password";
    pw.type = show ? "text" : "password";
    e.currentTarget.innerHTML = icon(show ? "eye-off" : "eye");
    e.currentTarget.setAttribute("aria-label", show ? "إخفاء كلمة المرور" : "إظهار كلمة المرور");
  });

  // مؤشر قوة كلمة المرور
  $("#pw").addEventListener("input", (e) => {
    const v = e.target.value;
    const score = [v.length >= 8, /[A-Z]/.test(v) || /[a-z]/.test(v) && /\d/.test(v), /\d/.test(v), /[^\w]/.test(v)].filter(Boolean).length;
    const colors = ["var(--danger)", "var(--brand)", "var(--sun)", "var(--mint)"];
    [...$("#strength").children].forEach((s, i) => s.style.background = i < score ? colors[score - 1] : "");
  });

  $("#forgot").addEventListener("click", (e) => { e.preventDefault(); toast("أرسلنا رابط الاستعادة إلى بريدك", "mail"); });
  document.querySelectorAll("[data-oauth]").forEach((b) => b.addEventListener("click", () => {
    // الربط: location.href = API_CONFIG.BASE_URL + "/auth/oauth/" + b.dataset.oauth
    toast("جارٍ التحويل…", "lock"); setTimeout(() => location.href = "dashboard.html", 700);
  }));

  $("#form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const email = $("#email"), pw = $("#pw");
    let ok = true;
    $("#emailErr").textContent = ""; $("#pwErr").textContent = "";
    email.classList.remove("invalid"); pw.classList.remove("invalid");
    if (!/^\S+@\S+\.\S+$/.test(email.value)) { $("#emailErr").textContent = "اكتب بريداً صحيحاً"; email.classList.add("invalid"); ok = false; }
    if (pw.value.length < 8) { $("#pwErr").textContent = "8 أحرف على الأقل"; pw.classList.add("invalid"); ok = false; }
    if (!ok) return;
    const btn = $("#submit");
    btn.disabled = true; btn.innerHTML = '<span class="spin"></span>';
    try {
      const body = { name: $("#name").value, email: email.value, password: pw.value };
      await (mode === "signup" ? API.signup(body) : API.login(body));
      location.href = params.get("next") || (sessionStorage.getItem("bssatha:draft") ? "create.html" : "dashboard.html");
    } catch (err) {
      toast(err.message, "alert"); btn.disabled = false; render();
    }
  });
})();
</script>
</body>
</html>
