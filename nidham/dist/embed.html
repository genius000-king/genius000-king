<title>&#1606;&#1616;&#1592;&#1575;&#1605; &#8212; &#1578;&#1602;&#1608;&#1610;&#1605; &#1608;&#1605;&#1607;&#1575;&#1605;</title>
<style>
/* ============================================================
   NIDHAM - calendar + tasks
   Two colours only: Lavender Haze #92A9E1 + Soft Graphite #2B2B2B
   on warm cream. Few blocks, wide margins, one control per job.
   ============================================================ */

:root{
  --bg:#EDE3D3;
  --card:#FAF6ED;
  --lav:#92A9E1;
  --lav-ink:#1C2130;
  --strong:#2B2B2B;          /* graphite block */
  --on-strong:#F7F2E8;
  --ink:#26241F;
  --muted:#918878;
  --line:rgba(38,36,31,.10);
  --hover:rgba(38,36,31,.05);
  --r:30px; --r-mid:22px; --r-sm:14px;
  --notch:16px;              /* radius of the curved cut between blocks */
  color-scheme:light;
}
[data-theme="dark"]{
  --bg:#111113;
  --card:#1A1A1D;
  --lav:#93A9E0;
  --lav-ink:#141721;
  --strong:#EDE7DD;
  --on-strong:#1A1A1D;
  --ink:#ECE6DC;
  --muted:#8A8377;
  --line:rgba(255,255,255,.09);
  --hover:rgba(255,255,255,.06);
  color-scheme:dark;
}

*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:"IBM Plex Sans Arabic","IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,sans-serif;
  font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;
  transition:background .3s ease,color .3s ease;
}
button,input,textarea,select{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer;padding:0}
input,textarea,select{border:0;outline:none;background:none}
::selection{background:var(--lav);color:var(--lav-ink)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------------------------- shell ------------------------------ */
.wrap{max-width:1040px;margin:0 auto;padding:26px 22px 70px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
.mark{font-weight:700;font-size:16px;letter-spacing:-.01em}
.mark i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--lav);margin-inline-end:8px;font-style:normal}
.dots-btn{
  width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--muted);
  transition:background .18s ease,color .18s ease;
}
.dots-btn:hover{background:var(--hover);color:var(--ink)}
.dots-btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}

.cols{display:grid;grid-template-columns:minmax(0,1fr) 368px;gap:22px;align-items:stretch}
.card{background:var(--card);border-radius:var(--r);position:relative}
.pad{padding:26px 26px 22px}

/* --------------------------- calendar ---------------------------- */
.cal-top{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.month{margin:0;font-size:24px;font-weight:700;letter-spacing:-.02em}
.month span{color:var(--muted);font-weight:500;margin-inline-start:6px}
.today-pill{
  padding:6px 14px;border-radius:999px;background:var(--lav);color:var(--lav-ink);
  font-size:12.5px;font-weight:600;
}
.step{display:flex;margin-inline-start:auto;background:var(--bg);border-radius:999px;padding:3px}
.step button{width:38px;height:34px;border-radius:999px;display:grid;place-items:center;color:var(--muted)}
.step button:hover{background:var(--card);color:var(--ink)}
.step svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
html[dir="rtl"] .step svg{transform:scaleX(-1)}

.dow{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:4px}
.dow span{text-align:center;font-size:11.5px;font-weight:600;color:var(--muted);padding-bottom:6px}
.grid{display:grid;grid-template-columns:repeat(7,1fr)}
.cell{
  position:relative;aspect-ratio:1/.9;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:6px;border-radius:var(--r-sm);
  color:var(--ink);transition:background .15s ease;
}
.cell:hover{background:var(--hover)}
.cell .n{font-size:16px;font-weight:500;line-height:1}
.cell.out .n{color:var(--muted);opacity:.4}
.cell.today .n{color:var(--lav);font-weight:700}
.cell.sel{background:var(--strong)}
.cell.sel .n,.cell.sel.today .n{color:var(--on-strong)}
.cell.drop{background:var(--lav);}
.cell.drop .n{color:var(--lav-ink)}
.pips{display:flex;gap:3px;height:5px}
.pips i{width:5px;height:5px;border-radius:50%;background:var(--lav);display:block}
.cell.sel .pips i{background:var(--on-strong);opacity:.75}
.pips i.done{background:var(--muted);opacity:.45}

/* ------------------------- day card ------------------------------ */
.day{overflow:hidden;display:flex;flex-direction:column;height:100%;min-height:430px}
.head{display:flex;gap:var(--notch);padding:0}
.hblock{
  position:relative;flex:1 1 auto;background:var(--lav);color:var(--lav-ink);
  padding:20px 24px 18px;border-end-end-radius:var(--r-mid);border-end-start-radius:0;
}
.hblock h2{margin:0;font-size:19px;font-weight:700;letter-spacing:-.01em}
.hblock p{margin:2px 0 0;font-size:12.5px;opacity:.65;font-weight:500}
.hcount{
  flex:0 0 auto;min-width:84px;background:var(--strong);color:var(--on-strong);
  display:grid;place-items:center;padding:0 18px;font-size:16px;font-weight:700;
  font-variant-numeric:tabular-nums;
  border-end-start-radius:var(--r-mid);border-end-end-radius:0;
}
/* the curved cut: a filler that arcs from the block edge into the card */
.hblock::after,.hcount::after{
  content:"";position:absolute;top:100%;width:var(--notch);height:var(--notch);
  -webkit-mask:radial-gradient(circle var(--notch) at 100% 100%,#0000 98%,#000 100%);
          mask:radial-gradient(circle var(--notch) at 100% 100%,#0000 98%,#000 100%);
}
.hblock::after{inset-inline-start:0;background:var(--lav)}
.hcount{position:relative}
.hcount::after{inset-inline-end:0;background:var(--strong);
  -webkit-mask:radial-gradient(circle var(--notch) at 0 100%,#0000 98%,#000 100%);
          mask:radial-gradient(circle var(--notch) at 0 100%,#0000 98%,#000 100%);
}
html[dir="rtl"] .hblock::after{
  -webkit-mask:radial-gradient(circle var(--notch) at 0 100%,#0000 98%,#000 100%);
          mask:radial-gradient(circle var(--notch) at 0 100%,#0000 98%,#000 100%);
}
html[dir="rtl"] .hcount::after{
  -webkit-mask:radial-gradient(circle var(--notch) at 100% 100%,#0000 98%,#000 100%);
          mask:radial-gradient(circle var(--notch) at 100% 100%,#0000 98%,#000 100%);
}

/* ------------------------------ list ----------------------------- */
.list{padding:14px 12px 6px;flex:1 1 auto}
.row{
  display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:var(--r-sm);
  transition:background .15s ease;
}
.row:hover{background:var(--hover)}
.row.dragging{opacity:.35}
.mark-btn{
  flex:0 0 auto;width:19px;height:19px;border-radius:50%;border:1.6px solid var(--muted);
  display:grid;place-items:center;transition:all .16s ease;
}
.mark-btn:hover{border-color:var(--ink)}
.row.big .mark-btn{border-color:var(--lav);border-width:2.4px}
.row.done .mark-btn{background:var(--muted);border-color:var(--muted)}
.mark-btn svg{width:10px;height:10px;fill:none;stroke:var(--card);stroke-width:3;opacity:0}
.row.done .mark-btn svg{opacity:1}
.row .t{flex:1 1 auto;min-width:0;text-align:start;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.row.done .t{color:var(--muted);text-decoration:line-through}
.row .when{flex:0 0 auto;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.row .when.late{color:var(--ink);font-weight:600}
.row .rep{flex:0 0 auto;width:13px;height:13px;color:var(--muted);opacity:.7}
.row .rep svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:1.8}
.empty{padding:44px 20px;text-align:center;color:var(--muted);font-size:13.5px}

/* ---------------------------- composer --------------------------- */
.compose{display:flex;gap:10px;padding:12px 14px 16px}
.compose .box{
  flex:1 1 auto;background:var(--strong);color:var(--on-strong);
  border-radius:var(--r-mid);padding:0 20px;display:flex;align-items:center;min-width:0;
}
.compose input{width:100%;padding:15px 0;font-size:14.5px}
.compose input::placeholder{color:var(--on-strong);opacity:.4}
.compose .plus{
  flex:0 0 auto;width:54px;border-radius:var(--r-mid);background:var(--lav);color:var(--lav-ink);
  display:grid;place-items:center;transition:transform .14s ease;
}
.compose .plus:active{transform:scale(.94)}
.compose .plus svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}

/* --------------------------- agenda view ------------------------- */
.agenda{padding:4px 4px 10px}
.agenda h3{
  margin:18px 12px 6px;font-size:12.5px;font-weight:600;color:var(--muted);
  display:flex;gap:8px;align-items:baseline;
}
.agenda h3:first-child{margin-top:2px}
.agenda h3 b{color:var(--ink);font-weight:600;font-size:14px}

/* ---------------------------- overlays --------------------------- */
.veil{position:fixed;inset:0;background:rgba(20,16,10,.42);backdrop-filter:blur(4px);z-index:50;
  display:flex;align-items:center;justify-content:center;padding:18px}
.veil[hidden]{display:none}
.sheet{
  width:min(430px,100%);background:var(--card);border-radius:var(--r);padding:24px;
  box-shadow:0 30px 80px -40px rgba(0,0,0,.6);animation:up .2s ease-out;max-height:90vh;overflow:auto;
}
@keyframes up{from{transform:translateY(10px);opacity:0}}
.sheet h3{margin:0 0 20px;font-size:18px;font-weight:700}
.opt{display:flex;align-items:center;gap:14px;padding:12px 2px;border-top:1px solid var(--line)}
.opt:first-of-type{border-top:0}
.opt label{flex:1 1 auto;font-size:14px;color:var(--muted)}
.seg{display:flex;background:var(--bg);border-radius:999px;padding:3px;gap:2px}
.seg button{padding:6px 13px;border-radius:999px;font-size:12.5px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--strong);color:var(--on-strong)}
.optrow{
  display:block;width:100%;text-align:start;padding:13px 4px;font-size:14px;font-weight:600;
  border-top:1px solid var(--line);border-radius:0;
}
.optrow:hover{color:var(--lav)}
.toggle{
  display:inline-flex;align-items:center;gap:9px;padding:9px 16px;border-radius:999px;
  background:var(--bg);font-size:13.5px;font-weight:600;color:var(--muted);
}
.toggle::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--muted);opacity:.45}
.toggle.on{background:var(--lav);color:var(--lav-ink)}
.toggle.on::before{background:var(--lav-ink);opacity:1}

.f{margin-bottom:13px}
.f label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}
.f input,.f textarea,.f select{
  width:100%;background:var(--bg);border-radius:var(--r-sm);padding:12px 15px;font-size:14.5px;
}
.f textarea{min-height:52px;resize:vertical}
.f.title input{background:none;padding:0 2px 10px;font-size:19px;font-weight:700;border-bottom:1.5px solid var(--line)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.foot{display:flex;align-items:center;gap:10px;margin-top:22px}
.btn{padding:12px 24px;border-radius:999px;font-size:14px;font-weight:600}
.btn.go{background:var(--strong);color:var(--on-strong);flex:1 1 auto}
.btn.quiet{color:var(--muted)}
.btn.quiet:hover{background:var(--hover)}

#searchInput{
  width:100%;background:var(--card);border-radius:var(--r-mid);padding:17px 22px;font-size:16px;
  box-shadow:0 24px 60px -34px rgba(0,0,0,.55);
}
.hits{margin-top:10px;background:var(--card);border-radius:var(--r-mid);padding:8px;max-height:50vh;overflow:auto}
.hits:empty{display:none}
.hit{display:flex;gap:12px;align-items:center;width:100%;padding:11px 14px;border-radius:var(--r-sm);text-align:start}
.hit:hover,.hit.on{background:var(--hover)}
.hit small{margin-inline-start:auto;color:var(--muted);font-size:12px;white-space:nowrap}
.search-wrap{width:min(520px,100%);margin-bottom:auto;margin-top:12vh}

.toasts{position:fixed;inset-block-end:24px;inset-inline:0;display:flex;flex-direction:column;
  align-items:center;gap:8px;z-index:70;pointer-events:none}
.toast{
  display:flex;align-items:center;gap:16px;background:var(--strong);color:var(--on-strong);
  padding:11px 20px;border-radius:999px;font-size:13.5px;pointer-events:auto;animation:up .2s ease-out;
}
.toast button{color:var(--lav);font-weight:700;font-size:13px}

/* ---------------------------- responsive ------------------------- */
@media (max-width:900px){
  .hblock{padding:16px 20px 14px}
  .hblock h2{font-size:17px}
  .hcount{min-width:72px;font-size:15px}
  .cols{grid-template-columns:1fr;gap:18px}
  .wrap{padding:20px 16px 60px}
  .pad{padding:20px 18px 16px}
  .day{min-height:0}
  .cell{aspect-ratio:1/.82}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

</style>

    parse: function (k) { var p = String(k).split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); },

  function seg(name, opts, cur) {
    return '<div class="seg">' + opts.map(function (o) {
      return '<button data-set="' + name + '" data-v="' + o[0] + '" class="' + (String(o[0]) === String(cur) ? 'on' : '') + '">' +
        esc(o[1]) + '</button>';
    }).join('') + '</div>';
  }
  function openMenu() {
    var st = Store.data.settings;
    $('menuBody').innerHTML =
      '<div class="opt"><label>' + esc(s().view) + '</label>' +
        seg('view', [['month', s().month], ['list', s().list]], V.view) + '</div>' +
      '<div class="opt"><label>' + esc(s().weekStart) + '</label>' +
        seg('weekStart', [[0, s().sun], [1, s().mon], [6, s().sat]], st.weekStart) + '</div>' +
      '<div class="opt"><label>' + esc(s().theme) + '</label>' +
        seg('theme', [['light', s().light], ['dark', s().dark]], st.theme) + '</div>' +
      '<div class="opt"><label>' + esc(s().lang) + '</label>' +
        seg('lang', [['ar', '\u0639'], ['en', 'EN']], st.lang) + '</div>' +
      [['search', s().search], ['export', s().exportJ], ['import', s().importJ],
       ['ics', s().ics], ['clear', s().clearDone]].map(function (r) {
        return '<button class="optrow" data-do="' + r[0] + '">' + esc(r[1]) + '</button>';
      }).join('');
    $('menuClose').textContent = s().close;
    $('menuVeil').hidden = false;
  }

  /* ------------------------------ backup --------------------------------- */
  function icsEsc(x) { return String(x).replace(/([,;\\])/g, '\\$1').replace(/\n/g, '\\n'); }
  function toICS() {
    var out = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//NIDHAM//EN'];
    Store.data.items.forEach(function (i) {
      var d = i.date.replace(/-/g, '');
      out.push('BEGIN:VEVENT', 'UID:' + i.id + '@nidham');
      if (i.time) {
        out.push('DTSTART:' + d + 'T' + i.time.replace(':', '') + '00');
        out.push('DTEND:' + d + 'T' + (i.end || i.time).replace(':', '') + '00');
      } else out.push('DTSTART;VALUE=DATE:' + d);
      out.push('SUMMARY:' + icsEsc(i.title));
      if (i.note) out.push('DESCRIPTION:' + icsEsc(i.note));
      out.push('END:VEVENT');
    });
    out.push('END:VCALENDAR');
    return out.join('\r\n');
  }
  function offer(name, text) {
    $('dataBox').value = text;
    $('dataVeil').hidden = false;
    $('dataCopy').textContent = s().copied.replace(/.$/, '') && s().exportJ;
    var ok = false;
    try {
      var url = URL.createObjectURL(new Blob([text], { type: 'text/plain' }));
      var a = document.createElement('a'); a.href = url; a.download = name; a.click();
      setTimeout(function () { URL.revokeObjectURL(url); }, 800);
      ok = true;
    } catch (e) {}
    if (!ok) toast(s().inBox);
  }

  /* ------------------------------- events -------------------------------- */
  function onClick(e) {
    var el = e.target.closest('[data-act],[data-set],[data-do]');
    if (!el) return;

    if (el.dataset.act === 'day') { V.sel = el.dataset.key; render(); return; }
    if (el.dataset.act === 'prev') { V.cursor = D.addMonths(V.cursor, -1); render(); return; }
    if (el.dataset.act === 'next') { V.cursor = D.addMonths(V.cursor, 1); render(); return; }
    if (el.dataset.act === 'today') { V.cursor = D.today(); V.sel = D.todayKey(); render(); return; }
    if (el.dataset.act === 'open') { openEditor(Store.get(el.dataset.id)); return; }
    if (el.dataset.act === 'toggle') {
      var r = Store.toggle(el.dataset.id);
      render();
      if (r && r.item.done && r.next) toast(rel(r.next.date), s().undo, function () {
        Store.remove(r.next.id); Store.update(r.item.id, { done: false, doneAt: null }); render();
      });
      return;
    }

    if (el.dataset.set) {                                   /* menu segments */
      var k = el.dataset.set, v = el.dataset.v;
      if (k === 'view') { V.view = v; Store.data.settings.view = v; }
      else Store.data.settings[k] = (k === 'weekStart') ? +v : v;
      Store.save(); openMenu(); render(); return;
    }

    if (el.dataset.do) {
      var d = el.dataset.do;
      $('menuVeil').hidden = true;
      if (d === 'search') { $('searchVeil').hidden = false; $('searchInput').value = ''; $('hits').innerHTML = '';
        $('searchInput').placeholder = s().searchGo; setTimeout(function () { $('searchInput').focus(); }, 30); }
      if (d === 'export') offer('nidham-' + D.todayKey() + '.json', JSON.stringify(Store.data, null, 2));
      if (d === 'ics') offer('nidham-' + D.todayKey() + '.ics', toICS());
      if (d === 'import') { $('dataBox').value = ''; $('dataVeil').hidden = false; setTimeout(function(){ $('dataBox').focus(); }, 30); }
      if (d === 'clear') {
        Store.data.items = Store.data.items.filter(function (i) { return !i.done; });
        Store.save(); render();
      }
      return;
    }
  }

  function quickAdd() {
    var t = $('quick').value.trim();
    if (!t) return;
    var it = Store.add(N.parseQuick(t, V.sel));
    $('quick').value = '';
    V.sel = it.date; V.cursor = D.parse(it.date);
    render();
  }

  var hitIdx = 0;
  function search() {
    var q = $('searchInput').value.trim().toLowerCase();
    if (!q) { $('hits').innerHTML = ''; return; }
    var found = Store.data.items.filter(function (i) {
      return (i.title + ' ' + i.note).toLowerCase().indexOf(q) >= 0;
    }).sort(function (a, b) { return a.date < b.date ? 1 : -1; }).slice(0, 15);
    hitIdx = 0;
    $('hits').innerHTML = found.length ? found.map(function (i, n) {
      return '<button class="hit' + (n === 0 ? ' on' : '') + '" data-id="' + i.id + '">' +
        '<span dir="auto">' + (i.done ? '\u00b7 ' : '') + esc(i.title) + '</span><small>' + esc(rel(i.date)) + '</small></button>';
    }).join('') : '<div class="empty">' + esc(s().nores) + '</div>';
  }
  function jump(id) {
    var it = Store.get(id); if (!it) return;
    $('searchVeil').hidden = true;
    V.sel = it.date; V.cursor = D.parse(it.date);
    render(); openEditor(it);
  }

  function bind() {
    document.addEventListener('click', onClick);
    $('menuBtn').onclick = openMenu;
    $('menuClose').onclick = function () { $('menuVeil').hidden = true; };
    $('addForm').onsubmit = function (e) { e.preventDefault(); quickAdd(); };
    $('addBtn').onclick = function () { openEditor({ date: V.sel, repeat: 'none' }); };

    $('eSave').onclick = saveEditor;
    $('eBig').onclick = function () { this.classList.toggle('on'); };
    $('eTime').addEventListener('input', function () { $('endWrap').hidden = !this.value; });
    $('eDel').onclick = function () {
      if (editing && editing.id) {
        var g = Store.remove(editing.id);
        $('editVeil').hidden = true; editing = null; render();
        toast(s().deleted, s().undo, function () { Store.put(g.item, g.at); render(); });
      }
    };
    $('eTitle').addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); saveEditor(); } });

    $('searchInput').addEventListener('input', search);
    $('searchInput').addEventListener('keydown', function (e) {
      var hits = [].slice.call($('hits').querySelectorAll('.hit'));
      if (!hits.length) return;
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        e.preventDefault(); hits[hitIdx].classList.remove('on');
        hitIdx = (hitIdx + (e.key === 'ArrowDown' ? 1 : -1) + hits.length) % hits.length;
        hits[hitIdx].classList.add('on'); hits[hitIdx].scrollIntoView({ block: 'nearest' });
      } else if (e.key === 'Enter') { e.preventDefault(); jump(hits[hitIdx].dataset.id); }
    });
    $('hits').addEventListener('click', function (e) {
      var b = e.target.closest('.hit'); if (b) jump(b.dataset.id);
    });

    $('dataSave').onclick = function () {
      try {
        var p = JSON.parse($('dataBox').value);
        if (!p || !Array.isArray(p.items)) throw 0;
        localStorage.setItem('nidham.v1', JSON.stringify(p));
        Store.load(); $('dataVeil').hidden = true; render();
      } catch (e) { toast(s().bad); }
    };
    $('dataCopy').onclick = function () {
      $('dataBox').select();
      try { document.execCommand('copy'); } catch (e) {}
      if (navigator.clipboard) navigator.clipboard.writeText($('dataBox').value).catch(function () {});
      toast(s().copied);
    };
    $('dataClose').onclick = function () { $('dataVeil').hidden = true; };

    ['menuVeil', 'editVeil', 'searchVeil', 'dataVeil'].forEach(function (id) {
      $(id).addEventListener('mousedown', function (e) { if (e.target === this) this.hidden = true; });
    });

    /* drag a task onto another day */
    var dragId = null;
    document.addEventListener('dragstart', function (e) {
      var r = e.target.closest('.row'); if (!r) return;
      dragId = r.dataset.id; r.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      try { e.dataTransfer.setData('text/plain', dragId); } catch (x) {}
    });
    document.addEventListener('dragend', function () {
      dragId = null;
      [].forEach.call(document.querySelectorAll('.dragging,.drop'), function (n) { n.classList.remove('dragging', 'drop'); });
    });
    document.addEventListener('dragover', function (e) {
      var c = e.target.closest('.cell'); if (!c || !dragId) return;
      e.preventDefault();
      if (!c.classList.contains('drop')) {
        [].forEach.call(document.querySelectorAll('.drop'), function (n) { n.classList.remove('drop'); });
        c.classList.add('drop');
      }
    });
    document.addEventListener('drop', function (e) {
      var c = e.target.closest('.cell');
      var id = dragId || (e.dataTransfer && e.dataTransfer.getData('text/plain'));
      if (!c || !id) return;
      e.preventDefault();
      var it = Store.get(id), from = it && it.date;
      if (!it || from === c.dataset.key) return;
      Store.update(id, { date: c.dataset.key });
      V.sel = c.dataset.key; render();
      toast(s().moved + ' \u00b7 ' + rel(c.dataset.key), s().undo, function () {
        Store.update(id, { date: from }); render();
      });
    });

    document.addEventListener('keydown', function (e) {
      var typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
      if (e.key === 'Escape') {
        ['menuVeil', 'editVeil', 'searchVeil', 'dataVeil'].forEach(function (id) { $(id).hidden = true; });
        if (typing) document.activeElement.blur();
        return;
      }
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
        e.preventDefault(); $('searchVeil').hidden = false; $('searchInput').value = ''; $('hits').innerHTML = '';
        setTimeout(function () { $('searchInput').focus(); }, 20); return;
      }
      if (typing || e.ctrlKey || e.metaKey || e.altKey) return;
      var k = e.key.toLowerCase();
      if (k === 'n') { e.preventDefault(); openEditor({ date: V.sel, repeat: 'none' }); }
      else if (k === 't') { V.cursor = D.today(); V.sel = D.todayKey(); render(); }
      else if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
        var fwd = (e.key === 'ArrowRight') !== (document.documentElement.dir === 'rtl');
        V.cursor = D.addMonths(V.cursor, fwd ? 1 : -1); render();
      }
    });

    var boot = D.todayKey();
    setInterval(function () { if (D.todayKey() !== boot) { boot = D.todayKey(); render(); } }, 60000);
  }

  function seed() {
    if (Store.data.items.length || localStorage.getItem('nidham.seeded')) return;
    var ar = Store.data.settings.lang === 'ar', t = D.todayKey();
    Store.add({ title: ar ? '\u0633\u0627\u0639\u0629 \u0631\u064a\u0627\u0636\u064a\u0627\u062a' : 'One hour of math', date: t, time: '20:00', repeat: 'daily' });
    Store.add({ title: ar ? '\u0645\u0631\u0627\u062c\u0639\u0629 \u062e\u0637\u0629 \u0627\u0644\u0623\u0633\u0628\u0648\u0639' : 'Review the week', date: D.key(D.add(D.today(), 1)), time: '09:00', big: true });
    try { localStorage.setItem('nidham.seeded', '1'); } catch (e) {}
  }

  document.addEventListener('DOMContentLoaded', function () {
    Store.load();
    V.view = Store.data.settings.view || 'month';
    $('prevBtn').innerHTML = I.left; $('nextBtn').innerHTML = I.right;
    $('menuBtn').innerHTML = I.more; $('addBtn').innerHTML = I.plus;
    seed(); bind(); render();
    if (location.protocol.indexOf('http') === 0 && 'serviceWorker' in navigator) {
      Promise.resolve()  /* bundled: no service worker */.catch(function () {});
    }
  });
})(window);

</script>
