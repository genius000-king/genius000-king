<!doctype html>
<html lang="ar" dir="rtl" data-theme="day">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NIDHAM · نِظام — تقويم ومهام</title>
<meta name="description" content="تقويم شهري ومهام يومية في واجهة واحدة — يعمل بلا إنترنت، وبياناتك تبقى في جهازك.">
<meta name="theme-color" content="#EFE4D2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Cairo:wght@400;600;800;900&family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
/* ============================================================
   NIDHAM — calendar + todo
   Design language: Lavender Haze (#92A9E1) · Soft Graphite (#2B2B2B)
   on a warm cream ground, chunky radii, interlocking pills.
   ============================================================ */

/* ---------- tokens ---------- */
:root{
  --cream:#EFE4D2;
  --card:#F8F1E4;
  --card-2:#E9DDC8;
  --lav:#92A9E1;
  --lav-deep:#6F88C4;
  --lav-soft:#C3D0EE;
  --slab:#2B2B2B;
  --slab-ink:#F3EEE4;
  --ink:#1E1E1E;
  --muted:#7A7264;
  --line:rgba(43,43,43,.16);
  --danger:#D2694F;
  --ok:#5F9E7E;
  --shadow:0 18px 40px -28px rgba(40,32,20,.75);
  --r-xl:34px; --r-lg:26px; --r-md:16px; --r-sm:11px;
  --ring:6px; /* interlocking cut-out ring width */
  color-scheme:light;
}
[data-theme="night"]{
  --cream:#17171A;
  --card:#212126;
  --card-2:#2A2A31;
  --lav:#8FA6E0;
  --lav-deep:#A9BCEC;
  --lav-soft:#38405A;
  --slab:#0E0E11;
  --slab-ink:#EFEAE0;
  --ink:#EDE7DC;
  --muted:#9A9387;
  --line:rgba(255,255,255,.13);
  --shadow:0 18px 40px -28px rgba(0,0,0,.9);
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--cream);color:var(--ink);
  font-family:"Manrope","Cairo",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;
  transition:background .25s ease,color .25s ease;
}
html[dir="rtl"] body{font-family:"Cairo","Manrope",ui-sans-serif,system-ui,sans-serif}
html[dir="rtl"] .nav .icon-btn svg{transform:scaleX(-1)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
::selection{background:var(--lav);color:#12131A}

.display{
  font-family:"Anton","Cairo",Impact,sans-serif;font-weight:400;
  text-transform:uppercase;letter-spacing:.015em;line-height:.95;
}
html[lang="ar"] .display{font-family:"Cairo","Anton",sans-serif;font-weight:900;text-transform:none;letter-spacing:0;line-height:1.15}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* ---------- shell ---------- */
.app{max-width:1300px;margin:0 auto;padding:20px 20px 90px}

.topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.brand{
  display:inline-flex;align-items:center;gap:10px;background:var(--slab);color:var(--slab-ink);
  padding:10px 18px;border-radius:var(--r-lg);box-shadow:var(--shadow);
}
.brand b{font-size:20px;color:var(--lav)}
.brand small{font-size:11px;letter-spacing:.16em;opacity:.6;text-transform:uppercase}
.spacer{flex:1 1 auto}

.icon-btn{
  width:42px;height:42px;display:grid;place-items:center;border-radius:14px;
  border:1.5px solid var(--line);background:var(--card);color:var(--ink);
  transition:transform .12s ease,background .2s ease,border-color .2s ease;
}
.icon-btn:hover{transform:translateY(-2px);border-color:var(--ink)}
.icon-btn.on{background:var(--lav);border-color:var(--lav);color:#16181F}
.icon-btn svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

.chip{
  display:inline-flex;align-items:center;gap:7px;padding:8px 15px;border-radius:999px;
  border:1.5px solid var(--line);background:transparent;color:var(--ink);white-space:nowrap;
  font-size:13px;font-weight:600;transition:all .16s ease;
}
.chip:hover{border-color:var(--ink)}
.chip.on{background:var(--slab);border-color:var(--slab);color:var(--slab-ink)}
.chip .count{font-size:11px;opacity:.65}
.chip.on .count{color:var(--lav);opacity:1}

/* ---------- layout ---------- */
.grid{display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:20px;align-items:start}
@media (max-width:1040px){
  .grid{grid-template-columns:1fr}
  #statsCard{order:2}   /* on a phone the plan matters more than the score */
  #dayCard{order:1}
}

.card{
  background:var(--card);border-radius:var(--r-xl);padding:22px;position:relative;
  box-shadow:var(--shadow);border:1.5px solid var(--line);
}
.card.slab{background:var(--slab);color:var(--slab-ink);border-color:transparent}
.card.lav{background:var(--lav);color:#181A22;border-color:transparent}
.card + .card{margin-top:20px}
aside{display:flex;flex-direction:column;gap:20px}
aside .card + .card{margin-top:0}

/* pill that "cuts into" the card edge, like the reference layout */
.notch{
  position:absolute;z-index:3;display:inline-flex;align-items:center;gap:8px;
  padding:9px 16px;border-radius:999px;font-size:12px;font-weight:700;letter-spacing:.04em;
  box-shadow:0 0 0 var(--ring) var(--cream);
}
.notch.tr{top:-14px;inset-inline-end:26px}
.notch.br{bottom:-14px;inset-inline-start:26px}
.notch.dark{background:var(--slab);color:var(--lav)}
.notch.light{background:var(--lav);color:#181A22}

/* ---------- calendar head ---------- */
.cal-head{display:flex;align-items:center;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.month-title{font-size:clamp(30px,4.4vw,46px);margin:0}
.month-title span{color:var(--lav-deep)}
.nav{display:flex;gap:8px;align-items:center}
.views{display:flex;gap:6px;padding:5px;background:var(--card-2);border-radius:999px}
.views button{padding:7px 14px;border-radius:999px;font-size:12.5px;font-weight:700;color:var(--muted)}
.views button.on{background:var(--slab);color:var(--slab-ink)}

/* ---------- month grid ---------- */
.dow{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-bottom:8px}
.dow span{
  text-align:center;font-size:11px;font-weight:800;letter-spacing:.12em;
  text-transform:uppercase;color:var(--muted);padding:4px 0;
}
.month{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.day{
  position:relative;min-height:96px;border-radius:var(--r-md);padding:9px 10px;
  background:var(--card-2);border:1.5px solid transparent;text-align:start;
  display:flex;flex-direction:column;gap:6px;overflow:hidden;
  transition:transform .12s ease,background .18s ease,border-color .18s ease;
}
.day:hover{transform:translateY(-2px);border-color:var(--ink)}
.day.out{opacity:.42}
.day .num{font-family:"Anton","Cairo",sans-serif;font-size:21px;line-height:1}
html[lang="ar"] .day .num{font-family:"Cairo",sans-serif;font-weight:800}
.day.today{background:var(--lav);color:#181A22}
.day.today .num{color:#181A22}
.day.sel{background:var(--slab);color:var(--slab-ink);border-color:var(--slab)}
[data-theme="night"] .day.sel{border-color:var(--lav)}
.day.sel .num{color:var(--lav)}
.day.drop{outline:2.5px dashed var(--lav-deep);outline-offset:-4px;background:var(--lav-soft)}
.day .mini{display:flex;flex-direction:column;gap:3px;margin-top:auto;width:100%}
.mini-row{
  display:flex;align-items:center;gap:5px;font-size:11px;font-weight:600;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.92;
}
.mini-row .bar{width:3px;height:11px;border-radius:2px;background:var(--lav-deep);flex:0 0 auto}
.mini-row .t{font-weight:800;opacity:.62;font-size:10px;flex:0 0 auto}
.mini-row .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.day.sel .mini-row .bar,.day.today .mini-row .bar{background:currentColor}
.mini-row.done{text-decoration:line-through;opacity:.45}
.more{font-size:10.5px;font-weight:800;opacity:.6}
.dots{display:none;gap:3px;margin-top:auto}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--lav-deep);display:block}
.day.today .dots i,.day.sel .dots i{background:currentColor}
@media (max-width:560px){
  .day{min-height:56px;padding:6px;border-radius:14px;gap:2px}
  .day .num{font-size:16px}
  .mini-row,.more{display:none}
  .dots{display:flex}
}

/* ---------- agenda / week ---------- */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.wcol{
  background:var(--card-2);border-radius:var(--r-md);padding:9px 8px;min-height:230px;
  display:flex;flex-direction:column;min-width:0;border:1.5px solid transparent;
}
.wcol.today{background:var(--lav);color:#181A22}
.wcol.sel{border-color:var(--slab)}
.wcol.drop{outline:2.5px dashed var(--lav-deep);outline-offset:-4px}
.whead{text-align:start;width:100%;color:inherit}
.wcol h4{margin:0 0 2px;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;opacity:.65}
.wcol .num{font-family:"Anton","Cairo",sans-serif;font-size:19px;line-height:1}
html[lang="ar"] .wcol .num{font-family:"Cairo",sans-serif;font-weight:800}
.wbody{margin-top:9px;display:flex;flex-direction:column;gap:5px;min-width:0}
.wempty{opacity:.35;font-size:12px}

/* compact item chip — used wherever a column is too narrow for a full row */
.chip-item{
  display:flex;align-items:flex-start;gap:6px;min-width:0;padding:7px 8px;border-radius:11px;
  background:var(--card);font-size:12px;line-height:1.35;border:1.4px solid transparent;
}
.cbody{display:flex;flex-direction:column;min-width:0;flex:1 1 auto}
.wcol.today .chip-item{background:rgba(255,255,255,.75)}
.chip-item.ev{border-color:var(--lav-deep)}
.chip-item.dragging{opacity:.4}
.chip-item .dot{
  width:11px;height:11px;border-radius:50%;border:2px solid var(--muted);flex:0 0 auto;padding:0;margin-top:3px;
}
.chip-item .dot.ev{background:var(--lav-deep);border-color:var(--lav-deep)}
.chip-item.done .dot{background:var(--ok);border-color:var(--ok)}
.chip-item .ct{
  min-width:0;text-align:start;color:inherit;font-weight:600;overflow:hidden;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
}
.chip-item.done .ct{text-decoration:line-through;opacity:.5}
.chip-item .ctm{font-size:10px;font-weight:800;opacity:.55;margin-top:2px}
@media (max-width:900px){
  .week{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (max-width:560px){
  .week{grid-template-columns:repeat(2,minmax(0,1fr))}
  .wcol{min-height:150px}
}

.agenda-day{margin-bottom:18px}
.agenda-day h3{margin:0 0 8px;font-size:15px;display:flex;align-items:center;gap:10px}
.agenda-day h3 em{font-style:normal;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.agenda-day .item .body{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.agenda-day .item .title{width:auto!important;flex:0 1 auto}
.agenda-day .item .meta{margin-top:0}

/* ---------- items ---------- */
.item{
  display:flex;align-items:flex-start;gap:11px;padding:11px 13px;border-radius:var(--r-md);
  background:var(--card-2);border:1.5px solid transparent;margin-bottom:8px;
  transition:transform .12s ease,border-color .16s ease,opacity .2s ease;
}
.card.slab .item{background:rgba(255,255,255,.07)}
.item:hover{border-color:var(--line);transform:translateX(0)}
.item.dragging{opacity:.4}
.item.done .title{text-decoration:line-through;opacity:.5}
.item .grab{cursor:grab;opacity:.35;flex:0 0 auto;padding-top:3px}
.item .grab:active{cursor:grabbing}
.tick{
  flex:0 0 auto;width:21px;height:21px;border-radius:50%;border:2px solid var(--muted);
  margin-top:2px;display:grid;place-items:center;transition:all .15s ease;
}
.tick:hover{border-color:var(--ink);transform:scale(1.1)}
.item.done .tick{background:var(--ok);border-color:var(--ok)}
.tick svg{width:12px;height:12px;stroke:#fff;stroke-width:3;fill:none;opacity:0}
.item.done .tick svg{opacity:1}
.item .body{flex:1 1 auto;min-width:0}
.item .title{font-weight:600;word-break:break-word}
.item .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}
.tag{
  font-size:10.5px;font-weight:800;letter-spacing:.05em;padding:3px 9px;border-radius:999px;
  border:1.4px solid var(--line);text-transform:uppercase;unicode-bidi:isolate;
}
.card.slab .tag{border-color:rgba(255,255,255,.2)}
.tag.p-high{background:var(--danger);border-color:var(--danger);color:#fff}
.tag.p-low{opacity:.6}
.tag.rep{border-style:dashed;opacity:.85}
.tag.ev{background:var(--lav);border-color:var(--lav);color:#181A22}
.tag.over{background:var(--danger);border-color:var(--danger);color:#fff}
.item .kill{opacity:0;flex:0 0 auto;padding:2px;color:var(--muted);transition:opacity .15s}
.item:hover .kill,.item:focus-within .kill{opacity:1}
.item .kill:hover{color:var(--danger)}
.item svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}

/* ---------- composer ---------- */
.composer{display:flex;gap:8px;align-items:center;background:var(--slab);border-radius:999px;padding:6px 6px 6px 18px}
html[dir="rtl"] .composer{padding:6px 18px 6px 6px}
.composer input{
  flex:1 1 auto;background:none;border:0;outline:none;color:var(--slab-ink);
  font-size:14.5px;min-width:0;padding:9px 0;
}
.composer input::placeholder{color:rgba(243,238,228,.45)}
.composer .go{
  width:38px;height:38px;border-radius:50%;background:var(--lav);color:#181A22;display:grid;place-items:center;
  flex:0 0 auto;transition:transform .12s ease;
}
.composer .go:hover{transform:scale(1.08)}
.composer .go svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round}
.hint{font-size:11.5px;color:var(--muted);margin:8px 2px 0}
.hint code{background:var(--card-2);padding:1px 6px;border-radius:6px;font-size:11px}

/* ---------- side panel ---------- */
.panel-head{display:flex;align-items:baseline;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.panel-head h2{margin:0;font-size:27px}
.panel-head .sub{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.card.slab .panel-head .sub{color:var(--lav)}
.filters{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
.empty{text-align:center;padding:26px 10px;color:var(--muted);font-size:13.5px}
.empty b{display:block;font-size:15px;color:var(--ink);margin-bottom:4px}
.card.slab .empty b{color:var(--slab-ink)}
.sect-label{
  font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;
  color:var(--muted);margin:16px 2px 8px;display:flex;align-items:center;gap:8px;
}
.sect-label::after{content:"";flex:1;height:1.5px;background:var(--line)}

/* ---------- stats ---------- */
.stats{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.ring{position:relative;width:84px;height:84px;flex:0 0 auto}
.ring svg{transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9;stroke-linecap:round}
.ring .bg{stroke:rgba(24,26,34,.18)}
.ring .fg{stroke:#181A22;transition:stroke-dashoffset .5s cubic-bezier(.4,0,.2,1)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:"Anton","Cairo",sans-serif;font-size:20px}
html[lang="ar"] .ring b{font-family:"Cairo",sans-serif}
.stat-lines{display:flex;flex-direction:column;gap:3px}
.stat-lines strong{font-size:19px;font-weight:800;line-height:1.2}
.stat-lines span{font-size:12px;opacity:.75}

/* ---------- modal ---------- */
.veil{
  position:fixed;inset:0;background:rgba(20,16,10,.55);backdrop-filter:blur(3px);
  display:grid;place-items:center;padding:18px;z-index:60;
}
.veil[hidden]{display:none!important}
.modal{
  width:min(520px,100%);max-height:88vh;overflow:auto;background:var(--card);
  border-radius:var(--r-xl);padding:24px;box-shadow:0 40px 90px -40px rgba(0,0,0,.7);
  animation:pop .18s ease-out;
}
@keyframes pop{from{transform:translateY(14px) scale(.98);opacity:0}}
.modal h3{margin:0 0 18px;font-size:25px}
.field{margin-bottom:13px}
.field label{display:block;font-size:11px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.field input,.field textarea,.field select{
  width:100%;padding:11px 14px;border-radius:var(--r-md);border:1.5px solid var(--line);
  background:var(--cream);outline:none;transition:border-color .15s;
}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--lav-deep)}
.field textarea{min-height:74px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{padding:8px 14px;border-radius:999px;border:1.5px solid var(--line);font-size:12.5px;font-weight:700}
.seg button.on{background:var(--lav);border-color:var(--lav);color:#181A22}
.modal-foot{display:flex;gap:10px;margin-top:20px;align-items:center}
.btn{padding:12px 22px;border-radius:999px;font-weight:800;font-size:13.5px;letter-spacing:.03em}
.btn.primary{background:var(--slab);color:var(--slab-ink)}
.btn.ghost{border:1.5px solid var(--line)}
.btn.warn{color:var(--danger)}
.btn:hover{filter:brightness(1.08)}

/* ---------- search ---------- */
.search-wrap{width:min(560px,100%);align-self:start;margin-top:9vh}
.search-wrap input{
  width:100%;padding:18px 24px;border-radius:var(--r-lg);border:0;outline:none;
  background:var(--card);font-size:18px;box-shadow:0 30px 70px -40px #000;
}
.results{margin-top:12px;background:var(--card);border-radius:var(--r-lg);padding:10px;max-height:52vh;overflow:auto}
.results:empty{display:none}
.res{display:flex;gap:10px;align-items:center;padding:11px 14px;border-radius:var(--r-md);width:100%;text-align:start}
.res:hover,.res.cur{background:var(--card-2)}
.res small{margin-inline-start:auto;color:var(--muted);font-size:11.5px;white-space:nowrap}

/* ---------- toast ---------- */
.toasts{position:fixed;inset-block-end:22px;inset-inline-start:50%;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center}
html[dir="rtl"] .toasts{transform:translateX(50%)}
.toast{
  display:flex;align-items:center;gap:14px;background:var(--slab);color:var(--slab-ink);
  padding:12px 18px;border-radius:999px;box-shadow:var(--shadow);animation:rise .2s ease-out;font-size:13.5px;
}
@keyframes rise{from{transform:translateY(12px);opacity:0}}
.toast button{color:var(--lav);font-weight:800;font-size:12.5px;text-transform:uppercase;letter-spacing:.06em}

/* ---------- footer strip ---------- */
.foot{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:26px;color:var(--muted);font-size:12px;align-items:center}
.foot .dot{width:5px;height:5px;border-radius:50%;background:var(--lav-deep)}

@media (max-width:640px){
  .app{padding:14px 14px 70px}
  .brand{flex:1 1 100%;justify-content:center}
  .topbar{gap:8px;justify-content:flex-end}
  .cal-head .spacer{display:none}
  .cal-head{gap:10px;justify-content:space-between}
  .month-title{flex:1 1 100%}
  .card{padding:16px;border-radius:26px}
  .notch{inset-inline-end:16px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

</style>
</head>
<body>

<div class="app">

  <header class="topbar">
    <div class="brand"><b class="display">NIDHAM</b><small id="tagline">تقويم ومهام</small></div>
    <span class="spacer"></span>
    <button class="icon-btn" id="btnSearch" title="/" aria-label="search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
    </button>
    <button class="icon-btn" id="btnLang" aria-label="language">EN</button>
    <button class="icon-btn" id="btnTheme" aria-label="theme">
      <svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg>
    </button>
    <button class="icon-btn" id="btnData" aria-label="data">
      <svg viewBox="0 0 24 24"><path d="M12 3v12m0 0-4-4m4 4 4-4"/><path d="M4 17v3h16v-3"/></svg>
    </button>
  </header>

  <div class="grid">

    <main>
      <section class="card" id="calCard">

    $('quickGo').onclick = quickAdd;
    $('quick').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); quickAdd(); }
    });

    $('btnLang').onclick = function () {
      Store.data.settings.lang = Store.data.settings.lang === 'ar' ? 'en' : 'ar';
      Store.save(); applyShell(); labelEditor(); UI.render();
    };
    $('btnTheme').onclick = function () {
      Store.data.settings.theme = Store.data.settings.theme === 'night' ? 'day' : 'night';
      Store.save(); applyShell();
    };
    $('btnSearch').onclick = function () {
      $('searchVeil').hidden = false; $('searchInput').value = ''; $('searchResults').innerHTML = '';
      $('searchInput').placeholder = UI.t().search;
      setTimeout(function () { $('searchInput').focus(); }, 30);
    };
    $('btnData').onclick = function () {
      var s = UI.t();
      $('dataTitleH').textContent = s.dataTitle;
      $('dataSubP').textContent = s.dataSub;
      $('dataBox').value = JSON.stringify(Store.data, null, 2);
      $('btnExport').textContent = s.exportJson; $('btnIcs').textContent = s.exportIcs;
      $('btnImport').textContent = s.importJson; $('btnCopy').textContent = s.copy;
      $('btnClearDone').textContent = s.clearDone; $('dataClose').textContent = s.close;
      $('wsLabel').textContent = s.weekStart;
      $('wsSel').innerHTML = [[0, s.sunday], [1, s.monday], [6, s.saturday]].map(function (p) {
        return '<option value="' + p[0] + '"' + (Store.data.settings.weekStart === p[0] ? ' selected' : '') + '>' + UI.esc(p[1]) + '</option>';
      }).join('');
      $('dataVeil').hidden = false;
    };
    $('wsSel').onchange = function () {
      Store.data.settings.weekStart = +this.value; Store.save(); UI.render();
    };
    $('btnExport').onclick = function () { offerFile('nidham-backup-' + D.todayKey() + '.json', JSON.stringify(Store.data, null, 2)); };
    $('btnIcs').onclick = function () { offerFile('nidham-' + D.todayKey() + '.ics', toICS()); };
    $('btnCopy').onclick = function () {
      $('dataBox').select();
      try { document.execCommand('copy'); } catch (e) {}
      if (navigator.clipboard) navigator.clipboard.writeText($('dataBox').value).catch(function () {});
      toast(UI.t().copied);
    };
    $('btnImport').onclick = function () {
      try {
        var parsed = JSON.parse($('dataBox').value);
        if (!parsed || !Array.isArray(parsed.items)) throw new Error('shape');
        Store.data = Object.assign(Store.data, parsed);
        Store.save(); applyShell(); UI.render();
        $('dataVeil').hidden = true; toast(UI.t().imported);
      } catch (e) { toast(UI.t().badJson); }
    };
    $('btnClearDone').onclick = function () {
      Store.data.items = Store.data.items.filter(function (i) { return !i.done; });
      Store.save(); UI.render();
    };

    /* editor */
    $('edSave').onclick = saveEditor;
    $('edCancel').onclick = closeEditor;
    $('edDel').onclick = function () {
      if (editing && editing.id) { Store.remove(editing.id); closeEditor(); UI.render(); }
    };
    $('edKind').onclick = function (e) {
      var b = e.target.closest('button'); if (!b) return;
      paintSeg('edKind', b.dataset.v);
      $('edEndWrap').style.display = b.dataset.v === 'event' ? '' : 'none';
    };
    $('edPrio').onclick = function (e) {
      var b = e.target.closest('button'); if (b) paintSeg('edPrio', b.dataset.v);
    };
    $('edTitle').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); saveEditor(); }
    });

    /* search */
    $('searchInput').addEventListener('input', runSearch);
    $('searchInput').addEventListener('keydown', function (e) {
      var res = Array.prototype.slice.call($('searchResults').querySelectorAll('.res'));
      if (!res.length) return;
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        e.preventDefault();
        res[searchCur].classList.remove('cur');
        searchCur = (searchCur + (e.key === 'ArrowDown' ? 1 : -1) + res.length) % res.length;
        res[searchCur].classList.add('cur');
        res[searchCur].scrollIntoView({ block: 'nearest' });
      } else if (e.key === 'Enter') { e.preventDefault(); jumpTo(res[searchCur].dataset.id); }
    });
    $('searchResults').addEventListener('click', function (e) {
      var b = e.target.closest('.res'); if (b) jumpTo(b.dataset.id);
    });

    /* veils close on backdrop click */
    ['editVeil', 'searchVeil', 'dataVeil'].forEach(function (id) {
      $(id).addEventListener('mousedown', function (e) { if (e.target === this) this.hidden = true; });
    });
    $('dataClose').onclick = function () { $('dataVeil').hidden = true; };

    /* drag & drop: move an item to another day */
    var dragId = null;
    document.addEventListener('dragstart', function (e) {
      var it = e.target.closest('.item,.chip-item'); if (!it) return;
      dragId = it.dataset.id; it.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      try { e.dataTransfer.setData('text/plain', dragId); } catch (err) {}
    });
    document.addEventListener('dragend', function (e) {
      var it = e.target.closest('.item,.chip-item'); if (it) it.classList.remove('dragging');
      dragId = null;
      Array.prototype.forEach.call(document.querySelectorAll('.drop'), function (n) { n.classList.remove('drop'); });
    });
    document.addEventListener('dragover', function (e) {
      var zone = e.target.closest('[data-act="day"],[data-act="dayzone"]');
      if (!zone || !dragId) return;
      e.preventDefault(); e.dataTransfer.dropEffect = 'move';
      if (!zone.classList.contains('drop')) {
        Array.prototype.forEach.call(document.querySelectorAll('.drop'), function (n) { n.classList.remove('drop'); });
        zone.classList.add('drop');
      }
    });
    document.addEventListener('drop', function (e) {
      var zone = e.target.closest('[data-act="day"],[data-act="dayzone"]');
      var id = dragId || (e.dataTransfer && e.dataTransfer.getData('text/plain'));
      if (!zone || !id) return;
      e.preventDefault();
      var it = Store.get(id), from = it && it.date;
      if (!it || from === zone.dataset.key) return;
      Store.update(id, { date: zone.dataset.key });
      V.selected = zone.dataset.key;
      UI.render();
      toast(UI.t().moved + ' ' + UI.fmtDay(zone.dataset.key), UI.t().undo, function () {
        Store.update(id, { date: from }); UI.render();
      });
    });

    /* keyboard */
    document.addEventListener('keydown', function (e) {
      var typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
      if (e.key === 'Escape') {
        ['editVeil', 'searchVeil', 'dataVeil'].forEach(function (id) { $(id).hidden = true; });
        if (typing) document.activeElement.blur();
        return;
      }
      if (typing || e.ctrlKey || e.metaKey || e.altKey) {
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); $('btnSearch').click(); }
        return;
      }
      var k = e.key.toLowerCase();
      if (k === 'n') { e.preventDefault(); openEditor({ kind: 'task', date: V.filter === 'inbox' ? null : V.selected, priority: 'normal', list: 'general', repeat: 'none' }); }
      else if (k === '/') { e.preventDefault(); $('btnSearch').click(); }
      else if (k === 't') { V.cursor = D.today(); V.selected = D.todayKey(); V.filter = 'day'; UI.render(); }
      else if (k === 'm') { V.view = 'month'; UI.render(); }
      else if (k === 'w') { V.view = 'week'; UI.render(); }
      else if (k === 'a') { V.view = 'agenda'; UI.render(); }
      else if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
        var rtl = document.documentElement.dir === 'rtl';
        var fwd = (e.key === 'ArrowRight') !== rtl;
        V.cursor = V.view === 'week' ? D.add(V.cursor, fwd ? 7 : -7) : D.addMonths(V.cursor, fwd ? 1 : -1);
        UI.render();
      }
    });

    /* a session left open overnight should not keep yesterday as "today" */
    var boot = D.todayKey();
    setInterval(function () { if (D.todayKey() !== boot) { boot = D.todayKey(); UI.render(); } }, 60000);
  }

  /* --------------------------------- init ---------------------------------- */
  function init() {
    Store.load();
    V.view = Store.data.settings.view || 'month';
    applyShell();
    seed();
    bind();
    labelEditor();
    UI.render();
    if (location.protocol.indexOf('http') === 0 && 'serviceWorker' in navigator) {
      Promise.resolve()  /* bundled: no service worker */.catch(function () {});
    }
  }
  document.addEventListener('DOMContentLoaded', init);
})(window);

</script>
</body>
</html>
