<!doctype html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>نِظام — تقويم ومهام</title>
<meta name="description" content="تقويم ومهام في واجهة واحدة هادئة. يعمل بلا إنترنت، وبياناتك تبقى في جهازك.">
<meta name="theme-color" content="#EDE3D3">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body>

<div class="wrap">
  <div class="top">
    <span class="mark"><i></i>نِظام</span>
    <button class="dots-btn" id="menuBtn" aria-label="menu"></button>
  </div>

  <div class="cols">
    <section class="card pad">
      <div class="cal-top">
        <h1 class="month" id="month"></h1>
        <button class="today-pill" id="todayPill" data-act="today" hidden></button>
        <div class="step">
          <button id="prevBtn" data-act="prev" aria-label="prev"></button>
          <button id="nextBtn" data-act="next" aria-label="next"></button>
        </div>
      </div>
      <div id="board"></div>
    </section>

    <section class="card day">
      <div class="head">
        <div class="hblock">
          <h2 id="dayName"></h2>
          <p id="dayDate"></p>
        </div>
        <div class="hcount" id="count"></div>
      </div>

      <div class="list" id="list"></div>

      <form class="compose" id="addForm">
        <div class="box"><input id="quick" autocomplete="off"></div>
        <button class="plus" id="addBtn" type="button" aria-label="new"></button>
      </form>
    </section>
  </div>
</div>

<div class="veil" id="menuVeil" hidden>
  <div class="sheet">
    <div id="menuBody"></div>
    <div class="foot"><button class="btn go" id="menuClose"></button></div>
  </div>
</div>

<div class="veil" id="editVeil" hidden>
  <div class="sheet">
    <div class="f title"><label id="lTitle" class="sr"></label><input id="eTitle" autocomplete="off"></div>
    <div class="two">
      <div class="f"><label id="lDate"></label><input id="eDate" type="date"></div>
      <div class="f"><label id="lTime"></label><input id="eTime" type="time"></div>
    </div>
    <div class="two">
      <div class="f" id="endWrap" hidden><label id="lEnd"></label><input id="eEnd" type="time"></div>
      <div class="f"><label id="lRepeat"></label><select id="eRepeat"></select></div>
    </div>
    <div class="f"><label id="lNote"></label><textarea id="eNote"></textarea></div>
    <button class="toggle" id="eBig" type="button"></button>
    <div class="foot">
      <button class="btn go" id="eSave"></button>
      <button class="btn quiet" id="eDel"></button>
    </div>
  </div>
</div>

<div class="veil" id="searchVeil" hidden>
  <div class="search-wrap">
    <input id="searchInput" autocomplete="off">
    <div class="hits" id="hits"></div>
  </div>
</div>

<div class="veil" id="dataVeil" hidden>
  <div class="sheet">
    <div class="f"><textarea id="dataBox" spellcheck="false"
      style="min-height:180px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px"></textarea></div>
    <div class="foot">
      <button class="btn go" id="dataSave">↧</button>
      <button class="btn quiet" id="dataCopy">⧉</button>
      <button class="btn quiet" id="dataClose">✕</button>
    </div>
  </div>
</div>

<div class="toasts" id="toasts"></div>

<script src="assets/js/core.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
